name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device binary
        working-directory: ios
        run: |
          xcodebuild \
            -project PadLink.xcodeproj \
            -scheme PadLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/PadLink.app Payload/
          zip -qry PadLink.ipa Payload
          ls -lh PadLink.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadLink-ipa
          path: PadLink.ipa

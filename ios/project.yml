name: PadLink
options:
  bundleIdPrefix: com.padlink
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  PadLink:
    type: application
    platform: iOS
    sources:
      - PadLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padlink.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
    info:
      path: PadLink/Info.plist
      properties:
        CFBundleDisplayName: PadLink
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

schemes:
  PadLink:
    build:
      targets:
        PadLink: all

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PadLink">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.png">
<script src="/static/lucide.min.js"></script>
<title>PadLink</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#eceef2;--pad:#e9ebf0;--padEdge:#dcdfe6;
  --text:#15171c;--text2:#6b7280;--text3:#9aa0ab;--line:#e3e5ea;
  --accent:#2f6bff;--accentInk:#fff;--accentSoft:#2f6bff1a;
  --ok:#16a34a;--danger:#dc2626;
  --shadow:0 1px 2px #0f172a0a,0 8px 24px #0f172a12;--r:16px;
}
[data-theme="dark"]{
  --bg:#0d0e12;--surface:#15171d;--surface2:#1b1e26;--pad:#161821;--padEdge:#252935;
  --text:#e9eaef;--text2:#9aa1ad;--text3:#6b7280;--line:#242833;
  --accent:#4c86ff;--accentInk:#fff;--accentSoft:#4c86ff24;
  --ok:#34d399;--danger:#f87171;
  --shadow:0 1px 2px #0006,0 10px 30px #0008;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
 font-family:-apple-system,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg.lucide{width:20px;height:20px;stroke-width:2.1}

#app{position:fixed;inset:0;display:none;flex-direction:column;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 状态条 */
#statusbar{display:flex;align-items:center;gap:7px;padding:7px 12px 3px;font-size:11.5px;color:var(--text3);flex-shrink:0}
#dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;transition:.3s}
#dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
#statusText{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#statusbar .mini{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;color:var(--text2)}
#statusbar .mini:active{background:var(--surface2)}

/* 工作区 */
#workspace{flex:1;position:relative;min-height:0;padding:0 10px}
.page{position:absolute;inset:0;padding:0 0 8px;display:none;flex-direction:column}
.page.active{display:flex}

/* 触控板页 */
#padPage .padWrap{flex:1;position:relative;min-height:0}
#pad{position:absolute;inset:0;border-radius:var(--r);background:var(--pad);
 border:1px solid var(--padEdge);box-shadow:var(--shadow);overflow:hidden}
#padHint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:9px;color:var(--text3);font-size:13px;line-height:1.85;text-align:center;pointer-events:none;
 transition:opacity .45s;opacity:.8}
#padHint.dim{opacity:0}
#padHint .k{display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
#padHint .k svg.lucide{width:16px;height:16px}
.ripple{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
 background:var(--accent);opacity:.35;pointer-events:none;animation:rip .34s ease-out forwards}
@keyframes rip{to{transform:scale(3.6);opacity:0}}
#quickCol{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#quickCol button{width:42px;height:42px;border-radius:13px;background:var(--surface);
 border:1px solid var(--line);color:var(--text2);display:flex;align-items:center;justify-content:center;
 box-shadow:var(--shadow);transition:transform .12s}
#quickCol button:active{transform:scale(.9);background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}

/* 键盘页 */
#kbPage{gap:8px;padding-top:6px}
#kbInput{width:100%;padding:11px 14px;font-size:15.5px;border-radius:12px;border:1px solid var(--line);
 background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;flex-shrink:0}
#kbInput:focus{border-color:var(--accent)}
#kbInput::placeholder{color:var(--text3)}
#kbGrid{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.krow{display:flex;gap:5px;flex:1;min-height:0}
.key{flex:1;border-radius:9px;background:var(--surface);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.06;
 font-size:15px;color:var(--text);transition:background .1s,transform .06s;min-height:0;overflow:hidden}
.key small{font-size:9px;color:var(--text3)}
.key:active{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);transform:scale(.97)}
.key.alt{background:var(--surface2);color:var(--text2);font-size:12px}
.key.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.key.w15{flex:1.5}.key.w2{flex:2}.key.w25{flex:2.4}.key.w55{flex:5.5}.key.ico{flex:.75}

/* 媒体页 */
#mediaPage{gap:10px;padding-top:8px;overflow-y:auto}
.mediaCard{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
 box-shadow:var(--shadow);padding:14px;flex-shrink:0}
.mediaCard h4{font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:.4px;
 text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.mediaCard h4 svg.lucide{width:14px;height:14px}
.transport{display:flex;align-items:center;justify-content:space-around;gap:8px}
.transport button{width:50px;height:50px;border-radius:16px;background:var(--surface2);
 display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .1s}
.transport button:active{transform:scale(.9)}
.transport button.primary{width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--accentInk)}
.transport button svg.lucide{width:23px;height:23px}
.transport button.primary svg.lucide{width:27px;height:27px}
.chipRow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);
 font-size:13px;color:var(--text);transition:transform .1s;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:scale(.95);background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.chip svg.lucide{width:15px;height:15px}

/* 音量滑块 */
.volRow{display:flex;align-items:center;gap:12px}
.volRow .ico{color:var(--text2);display:flex;flex-shrink:0}
.volRow .ico svg.lucide{width:20px;height:20px}
.volRow input[type=range]{flex:1;accent-color:var(--accent);height:26px}
.volRow .num{width:38px;text-align:right;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.volRow .muteBtn{width:38px;height:38px;border-radius:11px;background:var(--surface2);
 display:flex;align-items:center;justify-content:center;color:var(--text2)}
.volRow .muteBtn.off{color:var(--danger);background:var(--accentSoft)}

/* 应用页 */
#appsPage{padding-top:6px;overflow-y:auto}
.secTitle{font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:.4px;
 text-transform:uppercase;margin:10px 2px 9px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.secTitle .act{margin-left:auto;font-size:12px;color:var(--accent);text-transform:none;letter-spacing:0}
.searchWrap{position:relative;flex-shrink:0;margin-bottom:4px}
.searchWrap .sIco{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.searchWrap .sIco svg.lucide{width:16px;height:16px}
#appSearch{width:100%;padding:11px 13px 11px 36px;font-size:14.5px;border-radius:12px;
 border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none}
#appSearch:focus{border-color:var(--accent)}
.appGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.appTile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 5px 10px;
 border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:transform .1s}
.appTile:active{transform:scale(.94);border-color:var(--accent)}
.appTile img,.appTile .ph{width:38px;height:38px;border-radius:10px;object-fit:contain}
.appTile .ph{display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2)}
.appTile span{font-size:11.5px;color:var(--text2);text-align:center;line-height:1.25;
 max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.winList{display:flex;flex-direction:column;gap:7px}
.winRow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;
 background:var(--surface);border:1px solid var(--line)}
.winRow img,.winRow .ph{width:26px;height:26px;border-radius:7px;flex-shrink:0;object-fit:contain}
.winRow .ph{display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2)}
.winRow .t{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winRow .badge{font-size:10px;padding:2.5px 8px;border-radius:99px;background:var(--ok);color:#fff;flex-shrink:0}
.winRow .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
 color:var(--text2);flex-shrink:0}
.winRow .ic:active{background:var(--surface2)}
.winRow .ic.danger{color:var(--danger)}
.winRow .ic svg.lucide{width:17px;height:17px}

/* 设置页 */
#setPage{padding-top:6px;overflow-y:auto}
.setGroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
 box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;flex-shrink:0}
.setGroup .h{font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:.4px;
 text-transform:uppercase;padding:12px 14px 4px}
.setItem{display:flex;align-items:center;gap:11px;padding:11px 14px;font-size:14px}
.setItem+.setItem{border-top:1px solid var(--line)}
.setItem .lab{flex:1;color:var(--text)}
.setItem .sub{display:block;font-size:11.5px;color:var(--text3);margin-top:2px}
.setItem input[type=range]{width:120px;accent-color:var(--accent)}
.setItem .val{width:34px;text-align:right;font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.switch{width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);
 position:relative;transition:.22s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
 background:#fff;box-shadow:0 1px 3px #0003;transition:.22s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:23px}
.segRow{display:flex;gap:3px;background:var(--surface2);border-radius:10px;padding:3px}
.segRow button{padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--text2)}
.segRow button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0002}

/* Dock */
#dock{flex-shrink:0;display:flex;align-items:stretch;gap:2px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));
 background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:10}
.dockBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 padding:7px 2px;border-radius:12px;color:var(--text3);font-size:10px;transition:.15s}
.dockBtn svg.lucide{width:21px;height:21px}
.dockBtn.on{color:var(--accent);background:var(--accentSoft)}
.dockBtn:active{transform:scale(.94)}

/* 连接页 */
#connect{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:13px;padding:0 30px;background:var(--bg)}
.brand{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:4px}
.brand .logo{width:64px;height:64px;border-radius:20px;background:var(--accent);
 display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 24px var(--accentSoft)}
.brand .logo svg.lucide{width:33px;height:33px}
#connect h1{font-size:25px;font-weight:700;letter-spacing:-.4px}
#connect .sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.75}
#ipin{width:100%;max-width:330px;padding:13px 15px;font-size:16px;text-align:center;border-radius:13px;
 border:1px solid var(--line);background:var(--surface);color:var(--text);outline:none}
#ipin:focus{border-color:var(--accent)}
#connectBtn{width:100%;max-width:330px;padding:14px;border-radius:13px;background:var(--accent);
 color:var(--accentInk);font-size:16px;font-weight:600;box-shadow:0 6px 18px var(--accentSoft)}
#connectBtn:active{opacity:.86}
#scanBtn{color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:5px}
#scanBtn svg.lucide{width:16px;height:16px}
#scanStatus{font-size:12px;color:var(--text3);min-height:15px;text-align:center}
#recentBox{width:100%;max-width:330px;display:flex;flex-direction:column;gap:6px}
#recentBox .row{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;
 background:var(--surface);border:1px solid var(--line);font-size:14px;width:100%}
#recentBox .row .t{flex:1;text-align:left}
#recentBox .row svg.lucide{width:16px;height:16px;color:var(--text3)}

#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);
 background:#111a;color:#fff;padding:9px 16px;border-radius:11px;font-size:13px;z-index:99;
 opacity:0;transition:.26s;pointer-events:none;max-width:82vw;text-align:center;backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:760px){
 #app{max-width:900px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
 .appGrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
@media (orientation:landscape) and (max-height:540px){
 .dockBtn{font-size:0;gap:0;padding:9px 2px}
 .dockBtn svg.lucide{width:22px;height:22px}
 #statusbar{padding:4px 12px 0}
 #padHint{font-size:12px;line-height:1.65;gap:6px}
 #mediaPage{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
 .mediaCard{flex:1 1 46%}
}
</style>
</head>
<body>

<!-- 连接页 -->
<div id="connect">
  <div class="brand">
    <div class="logo"><i data-lucide="mouse-pointer-2"></i></div>
    <h1>PadLink</h1>
  </div>
  <div class="sub">手机 → 电脑的触控板 · 键盘 · 遥控器<br>请先在电脑上运行 PadLink</div>
  <input id="ipin" placeholder="电脑 IP，如 192.168.1.100" inputmode="decimal"
         autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="connectBtn">连接到电脑</button>
  <button id="scanBtn"><i data-lucide="radar"></i>扫描局域网</button>
  <div id="scanStatus"></div>
  <div id="recentBox"></div>
</div>

<!-- 主体 -->
<div id="app">
  <div id="statusbar">
    <div id="dot"></div>
    <div id="statusText">未连接</div>
    <button class="mini" id="fsBtn" title="全屏"><i data-lucide="maximize-2"></i></button>
    <button class="mini" id="themeBtn" title="主题"><i data-lucide="moon"></i></button>
  </div>

  <div id="workspace">

    <!-- 触控板 -->
    <section class="page active" id="padPage">
      <div class="padWrap">
        <div id="pad">
          <div id="padHint">
            <div class="k"><i data-lucide="hand"></i>单指拖动 · 移动指针</div>
            <div class="k"><i data-lucide="pointer"></i>轻点左键 · 双指轻点右键</div>
            <div class="k"><i data-lucide="move-vertical"></i>双指上下滑动 · 滚动</div>
          </div>
        </div>
        <div id="quickCol">
          <button id="qLeft" title="左键"><i data-lucide="mouse-pointer-2"></i></button>
          <button id="qMiddle" title="中键"><i data-lucide="circle-dot"></i></button>
          <button id="qRight" title="右键"><i data-lucide="mouse-pointer-click"></i></button>
        </div>
      </div>
    </section>

    <!-- 键盘 -->
    <section class="page" id="kbPage">
      <input id="kbInput" placeholder="输入文字或使用下方键盘（支持中文）"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div id="kbGrid"></div>
    </section>

    <!-- 媒体 -->
    <section class="page" id="mediaPage">
      <div class="mediaCard">
        <h4><i data-lucide="play"></i>播放</h4>
        <div class="transport">
          <button data-key="media_previous"><i data-lucide="skip-back"></i></button>
          <button class="primary" data-key="media_play_pause"><i data-lucide="play"></i></button>
          <button data-key="media_next"><i data-lucide="skip-forward"></i></button>
          <button data-key="media_stop"><i data-lucide="square"></i></button>
        </div>
      </div>
      <div class="mediaCard">
        <h4><i data-lucide="volume-2"></i>主机音量</h4>
        <div class="volRow">
          <button class="muteBtn" id="muteBtn"><i data-lucide="volume-2"></i></button>
          <input type="range" id="volSlider" min="0" max="100" step="1" value="50">
          <div class="num" id="volNum">--</div>
        </div>
      </div>
      <div class="mediaCard">
        <h4><i data-lucide="monitor"></i>系统</h4>
        <div class="chipRow">
          <button class="chip" data-key="win+d"><i data-lucide="monitor"></i>显示桌面</button>
          <button class="chip" data-key="win+tab"><i data-lucide="layout-dashboard"></i>任务视图</button>
          <button class="chip" data-key="alt+tab"><i data-lucide="app-window"></i>切换窗口</button>
          <button class="chip" data-key="win+l"><i data-lucide="lock"></i>锁定</button>
          <button class="chip" data-key="printscreen"><i data-lucide="camera"></i>截屏</button>
        </div>
      </div>
      <div class="mediaCard">
        <h4><i data-lucide="clipboard"></i>编辑</h4>
        <div class="chipRow">
          <button class="chip" data-key="ctrl+c">复制</button>
          <button class="chip" data-key="ctrl+v">粘贴</button>
          <button class="chip" data-key="ctrl+x">剪切</button>
          <button class="chip" data-key="ctrl+z">撤销</button>
          <button class="chip" data-key="ctrl+a">全选</button>
          <button class="chip" data-key="ctrl+s">保存</button>
        </div>
      </div>
    </section>

    <!-- 应用 -->
    <section class="page" id="appsPage">
      <div class="secTitle">已打开窗口
        <button class="act" id="winRefresh">刷新</button>
      </div>
      <div class="winList" id="winList"></div>
      <div class="secTitle" style="margin-top:16px">搜索程序</div>
      <div class="searchWrap">
        <span class="sIco"><i data-lucide="search"></i></span>
        <input id="appSearch" placeholder="输入程序名，如 notepad / 微信 / chrome"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      </div>
      <div class="appGrid" id="appGrid" style="margin-top:9px"></div>
    </section>

    <!-- 设置 -->
    <section class="page" id="setPage">
      <div class="setGroup">
        <div class="h">指针</div>
        <div class="setItem">
          <div class="lab">移动灵敏度<span class="sub">手指滑动 → 指针位移</span></div>
          <input type="range" id="sensSlider" min="0.8" max="3" step="0.1">
          <div class="val" id="sensVal"></div>
        </div>
        <div class="setItem">
          <div class="lab">滚动速度</div>
          <input type="range" id="scrollSlider" min="1" max="4" step="0.5">
          <div class="val" id="scrollVal"></div>
        </div>
      </div>
      <div class="setGroup">
        <div class="h">反馈</div>
        <div class="setItem">
          <div class="lab">仿生震动<span class="sub">按操作类型精细调制触觉</span></div>
          <button class="switch" id="vibSwitch"></button>
        </div>
        <div class="setItem">
          <div class="lab">震动强度<span class="sub">轻 / 标准 / 强</span></div>
          <div class="segRow" id="vibSeg">
            <button data-vib="light">轻</button>
            <button data-vib="normal">标准</button>
            <button data-vib="strong">强</button>
          </div>
        </div>
        <div class="setItem">
          <div class="lab">帮助水印<span class="sub">触摸淡出，闲置后恢复</span></div>
          <button class="switch" id="wmSwitch"></button>
        </div>
      </div>
      <div class="setGroup">
        <div class="h">外观</div>
        <div class="setItem">

<div id="toast"></div>

<script>
(function(){
"use strict";
var PORT=8765,TAP_MS=250,TAP_DIST=10;
var $=function(id){return document.getElementById(id)};
function icons(){try{window.lucide&&lucide.createIcons()}catch(e){}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");
 clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},2100)}
var LS={get:function(k,d){var v=localStorage.getItem("pl_"+k);return v===null?d:v},
        set:function(k,v){localStorage.setItem("pl_"+k,v)}};

/* ========= 仿生震动：分档 + 强度调制 =========
   基础图案按操作语义设计：
   - tap   轻点：极短单脉冲，模拟指尖轻触
   - left  左键：稍长一点的确认感
   - right 右键：双击节奏（两段），与左键区分
   - middle 中键：三段细密，机械滚轮按下的段落感
   - wheel 滚轮：超短刻度，配合滚动产生连续"哒哒"
   - page  切页：快速上扬双段
   - heavy 长按/危险：强而短的单脉冲
*/
var vibStrength=LS.get("vibStrength","normal");
var STRENGTH={light:0.55,normal:1,strong:1.55};
var VIB={
  tap:[[9]],
  left:[[13]],
  right:[[8,26,8]],
  middle:[[6,20,6,20,6]],
  wheel:[[4]],
  page:[[10,30,12]],
  heavy:[[22]]
};
function scalePattern(pat){
  var k=STRENGTH[vibStrength]||1;
  // 长于 3ms 的段时长随强度变化；间隔保持，保证节奏感；强档追加 2ms 提升"实感"
  return pat.map(function(seg){
    if(seg>0) return Math.max(2, Math.round(seg*k) + (vibStrength==="strong"?2:0));
    return seg;
  });
}
var vibOn=LS.get("vib","on")==="on";
function buzz(kind){
  if(!vibOn) return;
  var pat=VIB[kind]||VIB.tap;
  var p=scalePattern(pat);
  try{ navigator.vibrate && navigator.vibrate(p.length===1?p[0]:p); }catch(e){}
}

/* ========= 状态 ========= */
var ws=null,connected=false,pingTimer=null,reconnectTimer=null;
var host=LS.get("host","");
var sens=parseFloat(LS.get("sens","1.6"));
var scrollSpd=parseFloat(LS.get("scroll","2"));
var latency=null;
var volume=null,muted=false;

/* ========= 主题 ========= */
var themeMode=LS.get("theme","auto");
function effTheme(){ return themeMode!=="auto"?themeMode:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark") }
function applyTheme(){
  var t=effTheme();
  document.documentElement.setAttribute("data-theme",t);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=t==="light"?"#f4f5f7":"#0d0e12";
  $("themeBtn").innerHTML='<i data-lucide="'+(t==="dark"?"sun":"moon")+'"></i>';
  document.querySelectorAll("#themeSeg button").forEach(function(b){
    b.classList.toggle("on",b.dataset.theme===themeMode)});
  icons();
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(){if(themeMode==="auto")applyTheme()});

/* ========= 连接 ========= */
function setStatus(){
  $("dot").className=connected?"on":"";
  var t=!connected?"未连接":(latency!==null?host+" · "+latency+"ms":host);
  $("statusText").textContent=t;
  $("hostVal").textContent=host||"—";
  $("latVal").textContent=latency!==null?latency+" ms":"—";
}
function send(o){ if(connected&&ws&&ws.readyState===1) try{ws.send(JSON.stringify(o))}catch(e){} }

function connect(h){
  h=(h||"").trim(); if(!h) return;
  try{ws&&ws.close()}catch(e){}
  clearInterval(pingTimer);clearTimeout(reconnectTimer);
  $("statusText").textContent="正在连接 "+h+" …"; $("dot").className="";
  ws=new WebSocket("ws://"+h+":"+PORT+"/ws");
  var opened=false;
  ws.onopen=function(){
    opened=true;connected=true;host=h;
    LS.set("host",h);saveRecent(h);
    $("connect").style.display="none";$("app").style.display="flex";
    setStatus();buzz("page");
    send({t:"ping",ts:Date.now()});
    pingTimer=setInterval(function(){send({t:"ping",ts:Date.now()})},2000);
    send({t:"get_volume"});
    loadApps();loadWindows();icons();
  };
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    switch(m.t){
      case "pong": latency=Math.max(0,Date.now()-m.ts);setStatus();break;
      case "windows": renderWindows(m.list||[]);break;
      case "apps": renderApps(m.list||[]);break;
      case "volume":
        volume=m.level|0; muted=!!m.muted;
        $("volSlider").value=volume;
        $("volNum").textContent=muted?"静音":volume+"%";
        $("muteBtn").classList.toggle("off",muted);
        break;
    }
  };
  ws.onclose=function(){
    clearInterval(pingTimer);
    var was=connected; connected=false;latency=null;
    if(!opened){
      $("connect").style.display="flex";$("app").style.display="none";
      setStatus();toast("连接失败：检查同一 WiFi / 服务端 / 防火墙");
    }else if(was){
      setStatus();reconnectTimer=setTimeout(function(){connect(h)},2000);
    }
  };
}
function saveRecent(h){
  var list=JSON.parse(LS.get("recent","[]")).filter(function(x){return x!==h});
  list.unshift(h);LS.set("recent",JSON.stringify(list.slice(0,3)));
}
function renderRecent(){
  var list=JSON.parse(LS.get("recent","[]"));
  var box=$("recentBox");box.innerHTML="";
  list.forEach(function(h){
    var row=document.createElement("button");row.className="row";
    row.innerHTML='<i data-lucide="history"></i><span class="t">'+h+'</span><i data-lucide="arrow-right"></i>';
    row.addEventListener("click",function(){$("ipin").value=h;connect(h)});
    box.appendChild(row);
  });
  icons();
}

/* 局域网扫描 */
function guessPrefix(cb){
  try{
    var pc=new RTCPeerConnection({iceServers:[]});pc.createDataChannel("x");
    pc.onicecandidate=function(e){
      if(!e.candidate){try{pc.close()}catch(_){};return}
      var m=/(\d+\.\d+\.\d+)\.\d+/.exec(e.candidate.candidate);
      if(m&&!/^0\./.test(m[1])){try{pc.close()}catch(_){};cb(m[1])}
    };
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).catch(function(){cb(null)});
    setTimeout(function(){cb(null)},1600);
  }catch(e){cb(null)}
}
function probe(ip,ms){
  return new Promise(function(res){
    var done=false,ctrl=new AbortController();
    var to=setTimeout(function(){if(!done){done=true;res(null)}},ms);
    fetch("http://"+ip+":"+PORT+"/index.html",{signal:ctrl.signal,mode:"no-cors"})
      .then(function(){if(!done){done=true;clearTimeout(to);res(ip)}})
      .catch(function(){if(!done){done=true;clearTimeout(to);res(null)}});
  });
}
$("scanBtn").addEventListener("click",function(){
  var st=$("scanStatus");st.textContent="识别网段…";
  guessPrefix(function(prefix){
    if(!prefix) prefix="192.168."+((($("ipin").value||"").match(/^192\.168\.(\d+)\./)||[])[1]||"1");
    st.textContent="扫描 "+prefix+".1–254 …";
    var jobs=[];
    for(var i=1;i<=254;i++) jobs.push(probe(prefix+"."+i,420));
    Promise.all(jobs).then(function(found){
      found=found.filter(Boolean);
      if(found.length){st.textContent="找到 "+found.length+" 台";$("ipin").value=found[0];connect(found[0])}
      else st.textContent="未发现，请手动输入 IP";
    });
  });
});

/* ========= Dock ========= */
document.querySelectorAll(".dockBtn").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".dockBtn").forEach(function(x){x.classList.remove("on")});
    this.classList.add("on");
    var page=this.dataset.page;
    document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("active",p.id===page)});
    buzz("page");
    if(page==="appsPage"){loadWindows();loadApps()}
    if(page==="kbPage") setTimeout(function(){$("kbInput").focus()},140);
    if(page==="mediaPage") send({t:"get_volume"});
  });
});

/* ========= 全屏/主题 ========= */
function goFullscreen(){
  try{
    if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().then(function(){
        try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(function(){})}catch(e){}
      }).catch(function(){});
    }
  }catch(e){}
}
$("fsBtn").addEventListener("click",function(){
  if(document.fullscreenElement) document.exitFullscreen(); else goFullscreen();
});
$("themeBtn").addEventListener("click",function(){
  themeMode=effTheme()==="dark"?"light":"dark";LS.set("theme",themeMode);applyTheme();
});

/* ========= 触控板 ========= */
var touches={},scrollRef=null,padLast=null,scrollAccum=0;
var hintOn=LS.get("hint","on")==="on",hintTimer=null;
var pad=$("pad");
function padDim(on){$("padHint").classList.toggle("dim",on)}
function hintBack(){clearTimeout(hintTimer);hintTimer=setTimeout(function(){if(hintOn)padDim(false)},4000)}
function ripple(x,y){
  var r=document.createElement("div");r.className="ripple";
  r.style.left=x+"px";r.style.top=y+"px";
  pad.appendChild(r);setTimeout(function(){r.remove()},360);
}
pad.addEventListener("touchstart",function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    touches[t.identifier]={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,st:Date.now(),moved:false};
  }
  var ids=Object.keys(touches);
  if(ids.length===1) padLast={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  else if(ids.length===2){padLast=null;scrollRef=e.changedTouches[0].identifier;scrollAccum=0}
  padDim(true);clearTimeout(hintTimer);
},{passive:false});
pad.addEventListener("touchmove",function(e){
  e.preventDefault();
  var ids=Object.keys(touches);
  if(ids.length===1){
    var t=e.changedTouches[0],st=touches[t.identifier];
    if(!st) return;
    if(Math.abs(t.clientX-st.sx)>TAP_DIST||Math.abs(t.clientY-st.sy)>TAP_DIST) st.moved=true;
    if(padLast){
      var dx=(t.clientX-padLast.x)*sens,dy=(t.clientY-padLast.y)*sens;
      if(Math.abs(dx)>0.4||Math.abs(dy)>0.4) send({t:"move",dx:dx,dy:dy});
      padLast={x:t.clientX,y:t.clientY};
    }
  }else if(ids.length>=2){
    for(var i=0;i<e.changedTouches.length;i++){
      var t2=e.changedTouches[i];
      if(t2.identifier!==scrollRef) continue;
      var s2=touches[t2.identifier];if(!s2) continue;
      s2.moved=true;
      var dy2=(t2.clientY-s2.y)*scrollSpd;
      if(Math.abs(dy2)>0.4) send({t:"scroll",dx:0,dy:dy2});
      scrollAccum+=Math.abs(dy2);
      if(scrollAccum>28){buzz("wheel");scrollAccum=0}
      s2.x=t2.clientX;s2.y=t2.clientY;
    }
  }
},{passive:false});
pad.addEventListener("touchend",function(e){
  e.preventDefault();
  var ids=Object.keys(touches),now=Date.now();
  if(ids.length===2){
    var allTap=ids.every(function(k){var s=touches[k];return s&&!s.moved&&now-s.st<TAP_MS});
    if(allTap){send({t:"click",btn:"right"});buzz("right");ripple(pad.clientWidth/2,pad.clientHeight/2)}
  }else if(ids.length===1){
    var s=touches[ids[0]];
    if(s&&!s.moved&&now-s.st<TAP_MS){
      send({t:"click",btn:"left"});buzz("left");
      var rect=pad.getBoundingClientRect();ripple(s.sx-rect.left,s.sy-rect.top);
    }
  }
  for(var i=0;i<e.changedTouches.length;i++) delete touches[e.changedTouches[i].identifier];
  if(Object.keys(touches).length===0){padLast=null;scrollRef=null;hintBack()}
},{passive:false});
pad.addEventListener("touchcancel",function(e){
  for(var i=0;i<e.changedTouches.length;i++) delete touches[e.changedTouches[i].identifier];
  if(Object.keys(touches).length===0){padLast=null;scrollRef=null;hintBack()}
});
$("qLeft").addEventListener("click",function(){send({t:"click",btn:"left"});buzz("left")});
$("qMiddle").addEventListener("click",function(){send({t:"click",btn:"middle"});buzz("middle")});
$("qRight").addEventListener("click",function(){send({t:"click",btn:"right"});buzz("right")});

/* ========= 键盘 ========= */
var ROWS=[
  [["~","`"],["!","1"],["@","2"],["#","3"],["$","4"],["%","5"],["^","6"],["&","7"],["*","8"],["(","9"],[")","0"],["_","-"],["+","="],["⌫","backspace","w2"]],
  [["⇥","tab","w15"],["q"],["w"],["e"],["r"],["t"],["y"],["u"],["i"],["o"],["p"],["{","["],["}","]"],["|","\\"]],
  [["⇪","caps_lock","w15"],["a"],["s"],["d"],["f"],["g"],["h"],["j"],["k"],["l"],[":",";"],["\"","'"],["⏎","enter","w2"]],
  [["⇧","shift","w25"],["z"],["x"],["c"],["v"],["b"],["n"],["m"],["<",","],[">","."],["?","/"],["⇧","shift","w25"]],
  [["ctrl","ctrl","w15"],["win","win"],["alt","alt"],["空格","space","w55"],["esc","esc","w15"],
   ["←","left","ico"],["↑","up","ico"],["↓","down","ico"],["→","right","ico"]]
];
var mods=[],shiftOn=false,capsOn=false;
var MODKEYS=["ctrl","win","alt","shift","caps_lock","tab","enter","backspace","esc"];
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
(function buildKbd(){
  var grid=$("kbGrid");
  ROWS.forEach(function(row,ri){
    var div=document.createElement("div");div.className="krow";
    row.forEach(function(k,ki){
      var b=document.createElement("button");
      var cls="key"+(k[2]?" "+k[2]:"")+(MODKEYS.indexOf(k[1])>=0?" alt":"");
      b.className=cls;b.dataset.ri=ri;b.dataset.ki=ki;
      if(k[0]&&k[1]&&k[0]!==k[1]&&k[1].length===1) b.innerHTML="<small>"+escHtml(k[0])+"</small>"+escHtml(k[1]);
      else b.textContent=k[0]||k[1];
      b.addEventListener("click",function(){keyPress(ri,ki)});
      div.appendChild(b);
    });
    grid.appendChild(div);
  });
})();
function keyPress(ri,ki){
  var k=ROWS[ri][ki],name=k[1];buzz("tap");
  if(name==="shift"){shiftOn=!shiftOn;syncMods();return}
  if(name==="caps_lock"){capsOn=!capsOn;syncMods();return}
  if(["ctrl","win","alt"].indexOf(name)>=0){
    if(mods.indexOf(name)>=0) mods=mods.filter(function(m){return m!==name});
    else mods.push(name);
    syncMods();return;
  }
  var ch=name;
  if(ch.length===1){ if(/[a-z]/.test(ch)) ch=(shiftOn!==capsOn)?ch.toUpperCase():ch; else if(shiftOn) ch=k[0]; }
  if(mods.length) send({t:"key",value:mods.join("+")+"+"+ch});
  else send({t:"key",value:ch});
  if(shiftOn){shiftOn=false;syncMods()}
  if(mods.length){mods=[];syncMods()}
}
function syncMods(){
  document.querySelectorAll("#kbGrid .key").forEach(function(b){
    var ri=+b.dataset.ri,ki=+b.dataset.ki,name=ROWS[ri][ki][1];
    b.classList.remove("on");
    if(name==="shift"&&shiftOn) b.classList.add("on");
    if(name==="caps_lock"&&capsOn) b.classList.add("on");
    if(mods.indexOf(name)>=0) b.classList.add("on");
  });
}
var composing=false,flushTimer=null,kbInput=$("kbInput");
function flushBuffer(){
  clearTimeout(flushTimer);flushTimer=null;
  var v=kbInput.value;
  if(v){send({t:"text",value:v});kbInput.value=""}
}
kbInput.addEventListener("compositionstart",function(){composing=true;clearTimeout(flushTimer)});
kbInput.addEventListener("compositionend",function(){
  composing=false;clearTimeout(flushTimer);flushTimer=setTimeout(flushBuffer,120)});
kbInput.addEventListener("input",function(){
  if(composing) return;clearTimeout(flushTimer);flushTimer=setTimeout(flushBuffer,300)});
kbInput.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!composing){flushBuffer();send({t:"key",value:"return"});e.preventDefault()}});

/* ========= 媒体/音量 ========= */
document.querySelectorAll("[data-key]").forEach(function(b){
  b.addEventListener("click",function(){send({t:"key",value:b.dataset.key});buzz("left")});
});
var volSlider=$("volSlider");
volSlider.addEventListener("input",function(){

});
volSlider.addEventListener("change",function(){ send({t:"set_volume",level:parseInt(this.value,10)}) });

/* ========= 应用/窗口 ========= */
function loadWindows(){if(connected)send({t:"list_windows"})}
function loadApps(){if(connected)send({t:"list_apps"})}
$("winRefresh").addEventListener("click",function(){loadWindows();loadApps();buzz("tap")});

function renderWindows(list){
  var el=$("winList");el.innerHTML="";
  if(!list.length){el.innerHTML='<div class="winRow"><div class="t" style="color:var(--text3)">没有打开的窗口</div></div>';return}
  list.forEach(function(w){
    var row=document.createElement("div");row.className="winRow";
    var img=document.createElement("img");
    img.src="/icon?pid="+w.pid;
    img.onerror=function(){var ph=document.createElement("div");ph.className="ph";
      ph.innerHTML='<i data-lucide="app-window"></i>';img.replaceWith(ph);icons()};
    var t=document.createElement("div");t.className="t";t.textContent=w.title;
    row.appendChild(img);row.appendChild(t);
    if(w.foreground){
      var bd=document.createElement("div");bd.className="badge";bd.textContent="当前";row.appendChild(bd);
    }else{
      var f=document.createElement("button");f.className="ic";f.title="切换";
      f.innerHTML='<i data-lucide="corner-up-right"></i>';
      f.addEventListener("click",function(){send({t:"focus_window",id:w.id});buzz("tap");setTimeout(loadWindows,600)});
      row.appendChild(f);
    }
    if(w.minimized){
      var r=document.createElement("button");r.className="ic";r.title="还原";
      r.innerHTML='<i data-lucide="maximize-2"></i>';
      r.addEventListener("click",function(){send({t:"focus_window",id:w.id});buzz("tap");setTimeout(loadWindows,700)});
      row.appendChild(r);
    }else{
      var mn=document.createElement("button");mn.className="ic";mn.title="最小化";
      mn.innerHTML='<i data-lucide="minus"></i>';
      mn.addEventListener("click",function(){send({t:"min_window",id:w.id});buzz("tap");setTimeout(loadWindows,600)});
      row.appendChild(mn);
    }
    var c=document.createElement("button");c.className="ic danger";c.title="关闭";
    c.innerHTML='<i data-lucide="x"></i>';
    c.addEventListener("click",function(){
      send({t:"close_window",id:w.id});buzz("heavy");
      row.style.opacity=".4";setTimeout(loadWindows,1100)});
    row.appendChild(c);
    el.appendChild(row);
  });
  icons();
}
var allApps=[];
function renderApps(list){
  allApps=list;
  applyAppFilter($("appSearch").value);
}
function applyAppFilter(q){
  q=(q||"").trim().toLowerCase();
  var g=$("appGrid");g.innerHTML="";
  var list=allApps.filter(function(a){return !q||a.name.toLowerCase().indexOf(q)>=0});
  if(!list.length){
    g.innerHTML='<div style="grid-column:1/-1;color:var(--text3);font-size:13px;padding:14px 2px">没有匹配的程序</div>';
    return;
  }
  list.forEach(function(a){
    var b=document.createElement("button");b.className="appTile";
    var img=document.createElement("img");
    img.src="/icon?app="+encodeURIComponent(a.name);
    img.onerror=function(){var ph=document.createElement("div");ph.className="ph";
      ph.innerHTML='<i data-lucide="box"></i>';img.replaceWith(ph);icons()};
    var lab=document.createElement("span");lab.textContent=a.name;
    b.appendChild(img);b.appendChild(lab);
    b.addEventListener("click",function(){
      send({t:"open_app",name:a.name});buzz("left");setTimeout(loadWindows,1500)});
    g.appendChild(b);
  });
  icons();
}
$("appSearch").addEventListener("input",function(){applyAppFilter(this.value)});

/* ========= 设置 ========= */
function bindSlider(id,valId,get,set,fmt){
  var s=$(id),v=$(valId);s.value=get();v.textContent=fmt(get());
  s.addEventListener("input",function(){var n=parseFloat(this.value);set(n);v.textContent=fmt(n)});
}
bindSlider("sensSlider","sensVal",function(){return sens},function(n){sens=n;LS.set("sens",n)},function(n){return n.toFixed(1)});
bindSlider("scrollSlider","scrollVal",function(){return scrollSpd},function(n){scrollSpd=n;LS.set("scroll",n)},function(n){return n.toFixed(1)});
function bindSwitch(id,get,set){
  var b=$(id);
  function render(){b.classList.toggle("on",!!get())}
  render();
  b.addEventListener("click",function(){var v=!get();set(v);render();buzz("tap")});
}
bindSwitch("vibSwitch",function(){return vibOn},function(v){vibOn=v;LS.set("vib",v?"on":"off");if(v)buzz("left")});
bindSwitch("wmSwitch",function(){return hintOn},function(v){
  hintOn=v;LS.set("hint",v?"on":"off");$("padHint").style.display=v?"flex":"none"});
document.querySelectorAll("#vibSeg button").forEach(function(b){
  b.classList.toggle("on",b.dataset.vib===vibStrength);
  b.addEventListener("click",function(){
    vibStrength=this.dataset.vib;LS.set("vibStrength",vibStrength);
    document.querySelectorAll("#vibSeg button").forEach(function(x){x.classList.toggle("on",x===b)});
    buzz("middle");
  });
});
$("themeSeg").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b) return;
  themeMode=b.dataset.theme;LS.set("theme",themeMode);applyTheme();buzz("tap");
});
$("disconnectBtn").addEventListener("click",function(){
  buzz("heavy");try{ws&&ws.close()}catch(e){}
  connected=false;host="";latency=null;
  clearInterval(pingTimer);clearTimeout(reconnectTimer);
  $("app").style.display="none";$("connect").style.display="flex";
  renderRecent();setStatus();
});

/* ========= 启动 ========= */
$("connectBtn").addEventListener("click",function(){goFullscreen();connect($("ipin").value)});
$("ipin").addEventListener("keydown",function(e){if(e.key==="Enter"){goFullscreen();connect($("ipin").value)}});
applyTheme();icons();
$("ipin").value=host;renderRecent();
if($("padHint").style.display==="none") $("padHint").style.display="flex";
if(!hintOn) $("padHint").style.display="none";
if(host) connect(host);
var lastEnd=0;
document.addEventListener("touchend",function(e){
  var now=Date.now();if(now-lastEnd<300) e.preventDefault();lastEnd=now},{passive:false});
})();
</script>
</body>
</html>
